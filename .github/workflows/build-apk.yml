name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            tail -n 120 ../build.log | curl -s -d @- "https://ntfy.sh/ibbwifi_build_log_yusuf" || true
            exit 1
          fi

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/*.apk release-apk/ibbwifi-autologin.apk
          ls -lh release-apk/ibbwifi-autologin.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibbwifi-autologin-apk
          path: release-apk/ibbwifi-autologin.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "📱 IBB Wi-Fi Auto-Login Android APK"
          body: |
            ### 📱 Android İçin Otomatik Giriş Uygulaması (.apk)

            Bu APK dosyası GitHub Actions tarafından otomatik derlenmiştir.

            #### Kurulum & Kullanım:
            1. Aşağıdaki **`ibbwifi-autologin.apk`** dosyasına tıklayıp telefonunuza indirin.
            2. Dosyayı açıp telefonunuza kurun (Bilinmeyen kaynaklardan yüklemeye izin verin).
            3. Telefon numaranızı ve şifrenizi girip **"Bilgileri Kaydet"** butonuna basın.
            4. **"Otomatik Giriş"** anahtarını (Switch) **AÇIK** konuma getirin.
            
            Artık telefonunuz `ibbWiFi` ağına bağlandığı an arka planda sessizce giriş yapacaktır!
          files: release-apk/ibbwifi-autologin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
