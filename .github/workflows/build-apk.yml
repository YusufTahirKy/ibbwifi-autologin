name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        id: gradle_build
        working-directory: ./android
        run: |
          gradle :app:assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Push log to branch on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B ci-log
          git add build.log
          git commit -m "build log from failed run"
          git push -f origin ci-log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibbwifi-autologin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-app
          name: "📱 IBB Wi-Fi Auto-Login Android APK"
          body: |
            ### 📱 Android İçin Otomatik Giriş Uygulaması (.apk)

            Bu APK dosyası GitHub Actions tarafından otomatik derlenmiştir.

            #### Kurulum & Kullanım:
            1. Aşağıdaki **`app-debug.apk`** dosyasına tıklayıp telefonunuza indirin.
            2. Dosyayı açıp telefonunuza kurun (Bilinmeyen kaynaklardan yüklemeye izin verin).
            3. Telefon numaranızı ve şifrenizi girip **"Bilgileri Kaydet"** butonuna basın.
            4. **"Otomatik Giriş"** anahtarını (Switch) **AÇIK** konuma getirin.
            
            Artık telefonunuz `ibbWiFi` ağına bağlandığı an arka planda sessizce giriş yapacaktır!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
